<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - AI Disease Prediction</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <h2>AI Disease Prediction</h2>

        <div>
            <a href="/">Home</a>
            <a href="/login">Login</a>
        </div>

    </nav>


    <div class="form-container">

        <h1>Create Account</h1>

        {% if error %}
        <div class="error">
            {{ error }}
        </div>
        {% endif %}


        <form method="POST" action="{{ url_for('register') }}">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn">
                Register
            </button>

        </form>


        <p style="margin-top: 20px; text-align: center;">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login here
            </a>

        </p>

    </div>

</body>

</html>
